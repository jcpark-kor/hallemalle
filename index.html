<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL:Enchant 아이템 분배 관리 시스템</title>
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2e;
            --accent-gold: #f39c12;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-light: #e0e6ed;
            --border-color: #2c3248;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #141724;
            border-bottom: 2px solid var(--accent-gold);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
        }
        .container {
            padding: 20px 30px;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid var(--accent-gold);
        }
        .card-title {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .card-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent-gold);
        }
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #a0aec0;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom: 3px solid var(--accent-gold);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #141724;
            color: var(--accent-gold);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-gold {
            background-color: var(--accent-gold);
            color: #000;
        }
        .btn-sm {
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        .btn-warning {
            background-color: #f39c12;
            color: #000;
        }
        .btn-danger {
            background-color: var(--accent-red);
            color: #fff;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--accent-gold);
            padding: 25px;
            border-radius: 8px;
            width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #a0aec0;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #121420;
            color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <div class="title">SOL:Enchant 아이템 분배 관리 시스템</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="syncStatus" style="font-size: 0.8rem; color: #f39c12;">시트 연결중...</span>
            <span id="roleBadge" style="background:#3498db; padding:5px 10px; border-radius:4px; font-size:0.85rem;">일반 사용자 (조회전용)</span>
            <button id="authBtn" class="btn btn-gold btn-sm" onclick="toggleAuthModal()">관리자 로그인</button>
        </div>
    </header>

    <div class="container">
        <!-- Dashboard Section -->
        <div class="dashboard">
            <div class="card">
                <div class="card-title">총 획득 수입 (세후 92%)</div>
                <div class="card-value" id="totalRevenue">0 💎</div>
            </div>
            <div class="card" style="border-left-color: var(--accent-blue);">
                <div class="card-title">분배 완료 다이아</div>
                <div class="card-value" style="color: var(--accent-blue)" id="totalDistributedDia">0 💎</div>
            </div>
            <div class="card" style="border-left-color: var(--accent-green);">
                <div class="card-title">남은 정산 가능 다이아</div>
                <div class="card-value" style="color: var(--accent-green)" id="remainingDia">0 💎</div>
            </div>
            <div class="card" style="border-left-color: #9b59b6;">
                <div class="card-title">총 획득 건수 / 아이템 분배 건수</div>
                <div class="card-value" style="color: #9b59b6" id="totalCounts">0건 / 0건</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('drops', event)">획득 내역</button>
            <button class="tab-btn" onclick="switchTab('items', event)">아이템 분배내역</button>
            <button class="tab-btn" onclick="switchTab('dias', event)">다이아 분배내역</button>
        </div>

        <!-- Drops Tab -->
        <div id="dropsTab">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                <h3>보스 아이템 획득 내역</h3>
                <button class="btn btn-gold admin-only" style="display:none;" onclick="openDropModal()">획득 내역 추가</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>날짜</th><th>보스명</th><th>드랍 아이템</th><th>외판가(💎)</th><th>수입(8% 제외)</th><th class="admin-only" style="display:none;">관리</th>
                    </tr>
                </thead>
                <tbody id="dropTableBody"></tbody>
            </table>
        </div>

        <!-- Items Tab -->
        <div id="itemsTab" style="display:none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                <h3>아이템 분배 내역</h3>
                <button class="btn btn-gold admin-only" style="display:none;" onclick="openItemModal()">아이템 분배 등록</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>케릭명</th><th>날짜</th><th>아이템명</th><th class="admin-only" style="display:none;">관리</th>
                    </tr>
                </thead>
                <tbody id="itemTableBody"></tbody>
            </table>
        </div>

        <!-- Dias Tab -->
        <div id="diasTab" style="display:none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                <h3>다이아 분배 내역</h3>
                <button class="btn btn-gold admin-only" style="display:none;" onclick="openDiaModal()">다이아 분배 등록</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>케릭명</th><th>분배 다이아(💎)</th><th>날짜</th><th>메모</th><th class="admin-only" style="display:none;">관리</th>
                    </tr>
                </thead>
                <tbody id="diaTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <h3>관리자 로그인</h3>
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="adminId" placeholder="아이디 입력">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="adminPw" placeholder="비밀번호 입력">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" onclick="closeModal('loginModal')">취소</button>
                <button class="btn btn-gold" onclick="attemptLogin()">로그인</button>
            </div>
        </div>
    </div>

    <!-- Drop Modal -->
    <div id="dropModal" class="modal-overlay">
        <div class="modal">
            <h3 id="dropModalTitle">획득 내역 추가</h3>
            <input type="hidden" id="dropEditIndex">
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="dropDate">
            </div>
            <div class="form-group">
                <label>보스명</label>
                <input type="text" id="dropBoss" placeholder="예: 데몬">
            </div>
            <div class="form-group">
                <label>드랍 아이템</label>
                <input type="text" id="dropItem" placeholder="아이템명 입력">
            </div>
            <div class="form-group">
                <label>외판가(💎)</label>
                <input type="number" id="dropPrice" placeholder="1000" oninput="calculateTax()">
            </div>
            <div class="form-group">
                <label>수입(8% 세금 제외)</label>
                <input type="number" id="dropRevenue" readonly>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" onclick="closeModal('dropModal')">취소</button>
                <button class="btn btn-gold" onclick="saveDropEntry()">저장</button>
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div id="itemModal" class="modal-overlay">
        <div class="modal">
            <h3 id="itemModalTitle">아이템 분배 등록</h3>
            <input type="hidden" id="itemEditIndex">
            <div class="form-group">
                <label>케릭명</label>
                <input type="text" id="itemCharName" placeholder="캐릭터명 입력">
            </div>
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="itemDate">
            </div>
            <div class="form-group">
                <label>아이템 선택</label>
                <select id="itemSelect"></select>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" onclick="closeModal('itemModal')">취소</button>
                <button class="btn btn-gold" onclick="saveItemEntry()">저장</button>
            </div>
        </div>
    </div>

    <!-- Dia Modal -->
    <div id="diaModal" class="modal-overlay">
        <div class="modal">
            <h3 id="diaModalTitle">다이아 분배 등록</h3>
            <input type="hidden" id="diaEditIndex">
            <div class="form-group">
                <label>케릭명</label>
                <input type="text" id="diaCharName" placeholder="캐릭터명 입력">
            </div>
            <div class="form-group">
                <label>분배 다이아(💎)</label>
                <input type="number" id="diaAmount" placeholder="금액 입력">
            </div>
            <div class="form-group">
                <label>날짜</label>
                <input type="date" id="diaDate">
            </div>
            <div class="form-group">
                <label>메모</label>
                <input type="text" id="diaMemo" placeholder="비고 입력">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" onclick="closeModal('diaModal')">취소</button>
                <button class="btn btn-gold" onclick="saveDiaEntry()">저장</button>
            </div>
        </div>
    </div>

    <script>
        let appState = { isAdmin: false, drops: [], items: [], dias: [] };
        
        // ★ 새로 발급받은 구글 앱스 스크립트 웹 앱 URL을 여기에 입력하세요 ★
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwjCJAfoWErwXLWcQpT038CPrZbJVOxsEVR_z4IXdaTJ5m6BK7JJqL76wyj_1YjPWq-aw/exec';

        document.addEventListener('DOMContentLoaded', () => {
            loadSheetData();
            setTodayDates();
        });

        function getTodayString() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        function setTodayDates() {
            const today = getTodayString();
            document.getElementById('dropDate').value = today;
            document.getElementById('itemDate').value = today;
            document.getElementById('diaDate').value = today;
        }

        function calculateTax() {
            const price = parseFloat(document.getElementById('dropPrice').value) || 0;
            document.getElementById('dropRevenue').value = Math.round(price * 0.92);
        }

        // 구글 시트 데이터 불러오기 (타임아웃 적용)
        async function loadSheetData() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('여기에')) {
                document.getElementById('syncStatus').innerText = '스크립트 URL 설정 필요';
                document.getElementById('syncStatus').style.color = '#e74c3c';
                return;
            }
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10초 타임아웃
                
                const response = await fetch(GOOGLE_SCRIPT_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    appState.drops = data.drops || [];
                    appState.items = data.items || [];
                    appState.dias = data.dias || [];
                    renderAll();
                    document.getElementById('syncStatus').innerText = '구글 시트 연동됨';
                    document.getElementById('syncStatus').style.color = '#2ecc71';
                } else {
                    throw new Error('응답 오류');
                }
            } catch (e) {
                document.getElementById('syncStatus').innerText = '연동 지연/오류';
                document.getElementById('syncStatus').style.color = '#e74c3c';
            }
        }

        // 구글 시트로 데이터 저장하기
        async function saveSheetData() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('여기에')) {
                return alert('Google Script URL을 세팅해 주세요.');
            }
            
            document.getElementById('syncStatus').innerText = '시트 저장중...';
            document.getElementById('syncStatus').style.color = '#f39c12';

            const payload = {
                drops: appState.drops,
                items: appState.items,
                dias: appState.dias
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                setTimeout(loadSheetData, 1500);
            } catch (e) {
                alert('저장 실패: ' + e);
            }
            renderAll();
        }

        function switchTab(tab, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('dropsTab').style.display = 'none';
            document.getElementById('itemsTab').style.display = 'none';
            document.getElementById('diasTab').style.display = 'none';

            if (tab === 'drops') {
                document.getElementById('dropsTab').style.display = 'block';
                if (event) event.target.classList.add('active');
            } else if (tab === 'items') {
                document.getElementById('itemsTab').style.display = 'block';
                if (event) event.target.classList.add('active');
            } else if (tab === 'dias') {
                document.getElementById('diasTab').style.display = 'block';
                if (event) event.target.classList.add('active');
            }
        }

        function toggleAuthModal() {
            if (appState.isAdmin) {
                appState.isAdmin = false;
                document.getElementById('roleBadge').innerText = '일반 사용자 (조회전용)';
                document.getElementById('roleBadge').style.background = '#3498db';
                document.getElementById('authBtn').innerText = '관리자 로그인';
                renderAll();
            } else {
                document.getElementById('adminId').value = '';
                document.getElementById('adminPw').value = '';
                document.getElementById('loginModal').style.display = 'flex';
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function attemptLogin() {
            const id = document.getElementById('adminId').value.trim();
            const pw = document.getElementById('adminPw').value.trim();
            
            if (id === 'admin' && pw === 'erer963') {
                appState.isAdmin = true;
                document.getElementById('roleBadge').innerText = '관리자 모드';
                document.getElementById('roleBadge').style.background = '#f39c12';
                document.getElementById('authBtn').innerText = '로그아웃';
                closeModal('loginModal');
                renderAll();
            } else {
                alert('아이디 또는 비밀번호가 올바르지 않습니다.');
            }
        }

        // Drops CRUD
        function openDropModal(idx = -1) {
            document.getElementById('dropEditIndex').value = idx;
            if (idx === -1) {
                document.getElementById('dropModalTitle').innerText = '획득 내역 추가';
                document.getElementById('dropDate').value = getTodayString();
                document.getElementById('dropBoss').value = '';
                document.getElementById('dropItem').value = '';
                document.getElementById('dropPrice').value = '';
                document.getElementById('dropRevenue').value = '';
            } else {
                document.getElementById('dropModalTitle').innerText = '획득 내역 수정';
                const d = appState.drops[idx];
                document.getElementById('dropDate').value = d.date;
                document.getElementById('dropBoss').value = d.boss;
                document.getElementById('dropItem').value = d.item;
                document.getElementById('dropPrice').value = d.price;
                document.getElementById('dropRevenue').value = d.revenue;
            }
            document.getElementById('dropModal').style.display = 'flex';
        }

        function saveDropEntry() {
            const idx = parseInt(document.getElementById('dropEditIndex').value);
            const date = document.getElementById('dropDate').value || getTodayString();
            const boss = document.getElementById('dropBoss').value.trim();
            const item = document.getElementById('dropItem').value.trim();
            const price = parseFloat(document.getElementById('dropPrice').value) || 0;
            const revenue = Math.round(price * 0.92);

            if (!boss || !item) return alert('보스명과 아이템명을 입력해주세요.');

            const entry = { date, boss, item, price, revenue };
            if (idx === -1) appState.drops.push(entry);
            else appState.drops[idx] = entry;

            saveSheetData();
            closeModal('dropModal');
        }

        function deleteDrop(idx) {
            if (confirm('삭제하시겠습니까?')) { appState.drops.splice(idx, 1); saveSheetData(); }
        }

        // Items CRUD
        function openItemModal(idx = -1) {
            const select = document.getElementById('itemSelect');
            select.innerHTML = '';
            if (appState.drops.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '등록된 획득 아이템이 없습니다';
                select.appendChild(opt);
            } else {
                appState.drops.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.item;
                    opt.textContent = `${d.item} (${d.boss} - ${d.date})`;
                    select.appendChild(opt);
                });
            }

            document.getElementById('itemEditIndex').value = idx;
            if (idx === -1) {
                document.getElementById('itemModalTitle').innerText = '아이템 분배 등록';
                document.getElementById('itemCharName').value = '';
                document.getElementById('itemDate').value = getTodayString();
            } else {
                document.getElementById('itemModalTitle').innerText = '아이템 분배 수정';
                const it = appState.items[idx];
                document.getElementById('itemCharName').value = it.charName;
                document.getElementById('itemDate').value = it.date;
                document.getElementById('itemSelect').value = it.itemName;
            }
            document.getElementById('itemModal').style.display = 'flex';
        }

        function saveItemEntry() {
            const idx = parseInt(document.getElementById('itemEditIndex').value);
            const charName = document.getElementById('itemCharName').value.trim();
            const date = document.getElementById('itemDate').value || getTodayString();
            const itemName = document.getElementById('itemSelect').value;

            if (!charName || !itemName) return alert('캐릭터명과 아이템을 선택해주세요.');

            const entry = { charName, date, itemName };
            if (idx === -1) appState.items.push(entry);
            else appState.items[idx] = entry;

            saveSheetData();
            closeModal('itemModal');
        }

        function deleteItem(idx) {
            if (confirm('삭제하시겠습니까?')) { appState.items.splice(idx, 1); saveSheetData(); }
        }

        // Diamonds CRUD
        function openDiaModal(idx = -1) {
            document.getElementById('diaEditIndex').value = idx;
            if (idx === -1) {
                document.getElementById('diaModalTitle').innerText = '다이아 분배 등록';
                document.getElementById('diaCharName').value = '';
                document.getElementById('diaAmount').value = '';
                document.getElementById('diaDate').value = getTodayString();
                document.getElementById('diaMemo').value = '';
            } else {
                document.getElementById('diaModalTitle').innerText = '다이아 분배 수정';
                const d = appState.dias[idx];
                document.getElementById('diaCharName').value = d.charName;
                document.getElementById('diaAmount').value = d.amount;
                document.getElementById('diaDate').value = d.date;
                document.getElementById('diaMemo').value = d.memo || '';
            }
            document.getElementById('diaModal').style.display = 'flex';
        }

        function saveDiaEntry() {
            const idx = parseInt(document.getElementById('diaEditIndex').value);
            const charName = document.getElementById('diaCharName').value.trim();
            const amount = parseFloat(document.getElementById('diaAmount').value) || 0;
            const date = document.getElementById('diaDate').value || getTodayString();
            const memo = document.getElementById('diaMemo').value.trim();

            if (!charName || amount <= 0) return alert('캐릭터명과 금액을 입력해주세요.');

            const entry = { charName, amount, date, memo };
            if (idx === -1) appState.dias.push(entry);
            else appState.dias[idx] = entry;

            saveSheetData();
            closeModal('diaModal');
        }

        function deleteDia(idx) {
            if (confirm('삭제하시겠습니까?')) { appState.dias.splice(idx, 1); saveSheetData(); }
        }

        function renderAll() {
            const rev = appState.drops.reduce((sum, d) => sum + (d.revenue || 0), 0);
            const dist = appState.dias.reduce((sum, d) => sum + (d.amount || 0), 0);
            
            // Dashboard Render
            document.getElementById('totalRevenue').innerText = rev.toLocaleString() + ' 💎';
            document.getElementById('totalDistributedDia').innerText = dist.toLocaleString() + ' 💎';
            document.getElementById('remainingDia').innerText = (rev - dist).toLocaleString() + ' 💎';
            document.getElementById('totalCounts').innerText = `${appState.drops.length}건 / ${appState.items.length}건`;

            // Drops Table
            const dropBody = document.getElementById('dropTableBody');
            dropBody.innerHTML = appState.drops.map((d, i) => `
                <tr>
                    <td>${d.date}</td><td>${d.boss}</td><td>${d.item}</td>
                    <td>${Number(d.price).toLocaleString()}</td><td>${Number(d.revenue).toLocaleString()}</td>
                    ${appState.isAdmin ? `
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openDropModal(${i})">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDrop(${i})">삭제</button>
                        </td>
                    ` : ''}
                </tr>
            `).join('') || `<tr><td colspan="${appState.isAdmin ? 6 : 5}">등록된 획득 내역이 없습니다.</td></tr>`;

            // Items Table
            const itemBody = document.getElementById('itemTableBody');
            itemBody.innerHTML = appState.items.map((it, i) => `
                <tr>
                    <td>${it.charName}</td><td>${it.date}</td><td>${it.itemName}</td>
                    ${appState.isAdmin ? `
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openItemModal(${i})">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteItem(${i})">삭제</button>
                        </td>
                    ` : ''}
                </tr>
            `).join('') || `<tr><td colspan="${appState.isAdmin ? 4 : 3}">등록된 아이템 분배 내역이 없습니다.</td></tr>`;

            // Dias Table
            const diaBody = document.getElementById('diaTableBody');
            diaBody.innerHTML = appState.dias.map((d, i) => `
                <tr>
                    <td>${d.charName}</td><td>${Number(d.amount).toLocaleString()}</td><td>${d.date}</td><td>${d.memo || '-'}</td>
                    ${appState.isAdmin ? `
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="openDiaModal(${i})">수정</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteDia(${i})">삭제</button>
                        </td>
                    ` : ''}
                </tr>
            `).join('') || `<tr><td colspan="${appState.isAdmin ? 5 : 4}">등록된 다이아 분배 내역이 없습니다.</td></tr>`;

            // Admin Toggle Visibility
            document.querySelectorAll('.admin-only').forEach(el => {
                el.style.display = appState.isAdmin ? 'inline-block' : 'none';
            });
        }
    </script>
</body>
</html>
